name: Build vmlinux-btf

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本，多个用逗号分隔（留空跟 SDK 走，如 6.6.144,6.6.151）'
        required: false
        default: ''
      sdk:
        description: '只跑某个 SDK（24.10 / 25.12，留空全跑）'
        required: false
        default: ''
      arch:
        description: '只跑某个架构（如 x86_64，留空全跑）'
        required: false
        default: ''
  # quarterly safety net; kernel BTF only changes when the SDK kernel bumps
  schedule:
    - cron: '0 4 1 */3 *'

jobs:
  # 手动指定 sdk/arch 时只生成需要的组合：job 级 if 拿不到 matrix，只能先把
  # 组合算出来再交给 fromJSON。
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        env:
          WANT_SDK: ${{ inputs.sdk }}
          WANT_ARCH: ${{ inputs.arch }}
          WANT_KERNELS: ${{ inputs.kernel_version }}
        run: python3 scripts/gen-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 镜像的内核版本按架构分别重建，x86_64 等常落后；有输入时按输入编
      # 24.10 的点版本内核与分支 HEAD 不一致（例如 24.10.8 是 6.6.144，
      # 分支已经到 6.6.159），BTF 必须按用户实际 uname -r 编，所以两个 lane 都支持覆盖。
      - name: Pin shadow kernel version
        if: matrix.kernel != ''
        env:
          KERNEL_VERSION: ${{ matrix.kernel }}
        run: |
          sed -i "s|^BTF_KERNEL_VERSION?=.*|BTF_KERNEL_VERSION:=${KERNEL_VERSION}|" vmlinux-btf/Makefile
          grep -q "^BTF_KERNEL_VERSION:=${KERNEL_VERSION}\$" vmlinux-btf/Makefile

      # A full shadow-kernel compile needs the disk; drop unused toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Build vmlinux-btf
        uses: kenzok8/gh-action-sdk@hash
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: vmlinuxbtf
          PACKAGES: vmlinux-btf
          NO_REFRESH_CHECK: true
          INDEX: 1

      - name: Collect
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          FEED_DIR="bin/packages/${ARCH}/vmlinuxbtf"
          for f in "$FEED_DIR"/vmlinux-btf*.ipk "$FEED_DIR"/vmlinux-btf*.apk; do
            [ -f "$f" ] || continue
            # apk filenames carry no arch; tag it so assets stay unique
            base="$(basename "$f")"
            case "$base" in
              *.apk) cp -v "$f" "dist/${base%.apk}-${ARCH}.apk" ;;
              *)     cp -v "$f" "dist/$base" ;;
            esac
          done
          ls -la dist/ || true
          # 第二道网：没收到包就直接失败，别让空 dist 静默进发布
          if [ -z "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "::error::no vmlinux-btf package collected for ${ARCH}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # 同一架构可以同时编多个内核版本，名字必须带上内核号，否则 artifact 会撞名
          name: vmlinux-btf-${{ matrix.sdk }}-${{ matrix.arch }}${{ matrix.kernel != '' && format('-{0}', matrix.kernel) || '' }}
          path: dist/
          if-no-files-found: warn

  release:
    needs: build
    # 只出 artifact 的场景：非 main 分支试跑。资产是累积的，单点构建也可以发布，
    # 缺哪个内核的包就补哪个，不会冲掉已有资产。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten + manifest
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} dist/ \;
          ( cd dist && sha256sum * > ../SHA256SUMS ) || true
          cp SHA256SUMS dist/ 2>/dev/null || true
          ls -la dist/

      - name: Generate release body
        env:
          GH_TOKEN: <redacted>
        run: |
          # Body lists every package in the cumulative release, grouped by
          # architecture with SDK (25.12 apk / 24.10 ipk) as the table column.
          python3 scripts/gen-release-body.py --repo "${GITHUB_REPOSITORY}" \
            --dist dist --output BODY.md
          head -20 BODY.md

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: 内核 BTF 补全包
          bodyFile: BODY.md
          # 累积而不是替换：24.10 各点版本内核不同（6.6.144 / 6.6.151 / 6.6.159 …），
          # 全量替换会把老内核的包冲掉，历史固件就再也找不到匹配的 BTF。
          artifacts: dist/*
          allowUpdates: true
          removeArtifacts: false
          makeLatest: true

      # allowUpdates 只换资产，published_at 会停在首次发布；draft 往返刷成今天
      - name: Refresh release date
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/${REPO}/releases/tags/latest" -q .id)
          gh api -X PATCH "repos/${REPO}/releases/${id}" -F draft=true >/dev/null
          gh api -X PATCH "repos/${REPO}/releases/${id}" -F draft=false >/dev/null
          gh api "repos/${REPO}/releases/${id}" -q '.published_at'
